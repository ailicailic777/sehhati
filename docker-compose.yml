services:
  app:
    build: .
    ports:
      - "8080:80"
    volumes:
      - sehhati-storage:/var/www/html/storage
      - sehhati-database:/var/www/html/database
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/html/database/database.sqlite

volumes:
  sehhati-storage:
  sehhati-database:
